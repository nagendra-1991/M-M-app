
name: M&M Car Showroom CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Install and Test Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: build application
        run: npm run build
      - name: tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/script.js

      - name: Verify application starts
        run: |
          timeout 5s npm start || test $? -eq 124

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: mm-car-showroom
          path: |
            server.js
            package.json
            package-lock.json
            public/
          if-no-files-found: error

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mm-car-showroom:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mm-car-showroom:${{ github.sha }}
